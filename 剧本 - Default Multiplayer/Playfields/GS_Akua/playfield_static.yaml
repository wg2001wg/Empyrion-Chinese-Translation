# ==============================================================

### Resource Deposits
RandomResources:
    - Name: CarbonResource
      Biome: [ Heath, Savanna, Hills, Plains, SavannaEdge, HighGrass, Grassland_1, Grassland ]
      CountMinMax: [ 2, 2 ]
      SizeMinMax: [ 5, 7 ]
      DepthMinMax: [ 0, 5 ]
      DroneProb: 0.2
      MaxDroneCount: 1
      
    - Name: IronResource
      Biome: [ HighMountains, Mountains, LowMountains, Hills, IronOreClusters]
      CountMinMax: [ 4, 4 ]
      SizeMinMax: [ 5, 7 ]
      DepthMinMax: [ 5, 10 ]
      DroneProb: 0.2
      MaxDroneCount: 1

    - Name: CopperResource
      Biome: [ Meadow, Forest_Water, Forest_1, Forest, CopperOreClusters]
      CountMinMax: [ 4, 4 ]
      SizeMinMax: [ 4, 6 ]
      DepthMinMax: [ 5, 10 ]
      DroneProb: 0.3

    - Name: SiliconResource
      Biome: [ DeepWater, Water, ShallowWater, WaterRifts, WaterSwamp, Beach, Marsh, Forest_Water, Grassland_1Water]
      CountMinMax: [ 6, 6 ]
      SizeMinMax: [ 4, 6 ]
      DepthMinMax: [ 5, 10 ]
      DroneProb: 0.3  

### Resource Asteroids
AsteroidResources:
     - Name: IronResource
       Threshold: 0.2
       Amount: 0.2
     - Name: CopperResource
       Threshold: 0.2
       Amount: 0.2
     - Name: SiliconResource
       Threshold: 0.2
       Amount: 0.2
     - Name: CarbonResource
       Threshold: 0.2
       Amount: 0.2

### POIs
POIs:
    Random:
        - GroupName: NullPOI
          CountMinMax: [ 1, 1 ]
          SpawnPOINear: [START]
          SpawnPOINearDistance: 10
          IsImportant: True
          SpawnResource: ["IronResource:1-1", "CopperResource:1-1", "SiliconResource:1-1" ]
          SpawnResourceRange: [300, 400]

        - GroupName: TemperateStarterFarmVH
          IsImportant: True
          Faction: None          
          CountMinMax: [ 1, 1 ]
          SpawnPOINear: [ TOTObeliskTemperate ]
          SpawnPOINearRange: [50,200]
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 360

        - GroupName: TemperateStarterTribalTower
          Faction: None          
          CountMinMax: [ 1, 1 ]
          SpawnPOIAvoid: [ START ]
          SpawnPOIAvoidDistance: 800
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 360

